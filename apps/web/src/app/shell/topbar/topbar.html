<header class="topbar">
  <div class="topbar__spacer"></div>

  <label class="topbar__language" [attr.aria-label]="'shell.language' | translate">
    <select [value]="currentLocale()" (change)="setLocale($any($event.target).value)">
      @for (locale of locales; track locale) {
        <option [value]="locale">{{ locale }}</option>
      }
    </select>
  </label>

  <app-button variant="ghost" [attr.aria-label]="'shell.toggleTheme' | translate" (pressed)="toggleTheme()">🌓</app-button>

  <app-button variant="secondary" (pressed)="signOut()">{{ 'shell.signOut' | translate }}</app-button>
</header>
