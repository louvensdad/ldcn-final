<div class="dialog-backdrop" (click)="cancel()" (keydown.escape)="cancel()">
  <form #dialogRef class="dialog" role="dialog" aria-modal="true" aria-labelledby="new-task-dialog-title" [formGroup]="form" (ngSubmit)="submit()" (click)="$event.stopPropagation()" (keydown)="onKeydown($event)">
    <h2 class="dialog__title" id="new-task-dialog-title">{{ 'tasks.newTask' | translate }}</h2>
    <label class="dialog__field">
      <span>{{ 'tasks.descriptionLabel' | translate }}</span>
      <textarea formControlName="description" rows="3" autofocus></textarea>
    </label>
    @if (error(); as err) {
      <p class="dialog__error">{{ err.translationKey | translate }}</p>
    }
    <div class="dialog__actions">
      <app-button variant="ghost" type="button" (pressed)="cancel()">{{ 'common.cancel' | translate }}</app-button>
      <app-button variant="primary" type="submit" [disabled]="form.invalid || submitting()">{{ 'tasks.classify' | translate }}</app-button>
    </div>
  </form>
</div>
