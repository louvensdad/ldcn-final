<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login__title">{{ 'login.title' | translate }}</h1>
    <label class="login__field">
      <span>{{ 'login.apiKeyLabel' | translate }}</span>
      <input type="password" formControlName="apiKey" autocomplete="off" />
    </label>
    <p class="login__hint">{{ 'login.apiKeyHint' | translate }}</p>
    <app-button variant="primary" type="submit" [disabled]="form.invalid">{{ 'login.submit' | translate }}</app-button>
  </form>
</div>
