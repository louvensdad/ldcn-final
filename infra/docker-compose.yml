services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ldcn
      POSTGRES_PASSWORD: ldcn_dev
      POSTGRES_DB: ldcn
    ports:
      - "5432:5432"
    volumes:
      - ldcn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldcn -d ldcn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ldcn-postgres:
